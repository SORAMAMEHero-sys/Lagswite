name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. アップロードされたZIPを自動解凍する
      - name: Unpack Project ZIP if present
        run: |
          if [ -f "SoramameAutoClicker_FireHD8_Project.zip" ]; then
            echo "Unpacking SoramameAutoClicker_FireHD8_Project.zip..."
            unzip -q -o SoramameAutoClicker_FireHD8_Project.zip
          fi

      # 2. Java 17 をセットアップ
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradleを自動整備してAPKをビルド
      - name: Setup Gradle and Build APK
        run: |
          if [ -d "android" ]; then
            cd android
          fi

          # アイコンの自動補正（エラー防止）
          mkdir -p app/src/main/res/drawable
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2E7D32" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#4CAF50" android:pathData="M54,20 C35.2,20 20,35.2 20,54 C20,72.8 35.2,88 54,88 C72.8,88 88,72.8 88,54 C88,35.2 72.8,20 54,20 Z"/>
          </vector>
          EOF
          sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/@mipmap\/ic_launcher_round/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml || true

          # gradlew が無ければ自動生成
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.4 || true
          fi

          chmod +x gradlew || true

          # デバッグAPKのビルドを実行
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # 4. 生成された APK をダウンロードできるように保存
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soramame-autoclicker-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
